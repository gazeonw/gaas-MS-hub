<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人工评分台 · AKEEYO 数字面试</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1a1a1a;line-height:1.55;padding-bottom:80px}
    .topbar{background:#0a0a0a;color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
    .logo{height:30px;width:auto;display:block}
    .muted{color:#9a9a9a;font-size:12.5px}
    .wrap{max-width:1280px;margin:18px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e3e3e3;border-radius:12px;padding:16px 18px;margin-bottom:14px}
    h2{font-size:15px;color:#d60012;margin-bottom:10px;border-left:4px solid #d60012;padding-left:9px}
    .kv{display:flex;gap:8px;flex-wrap:wrap}
    .kv div{background:#fafafa;border:1px solid #eee;border-radius:8px;padding:6px 12px;font-size:13px}
    .kv b{color:#6b6b6b;font-weight:600;margin-right:4px}
    .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
    @media(max-width:960px){.grid{grid-template-columns:1fr}}
    pre{white-space:pre-wrap;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:12px;font-size:13px;max-height:340px;overflow:auto}
    .q-card{border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:10px}
    .q-title{font-weight:700;font-size:13.5px;margin-bottom:6px}
    .q-meta{font-size:12px;color:#6b6b6b;margin-bottom:6px}
    .q-trans{white-space:pre-wrap;background:#fafafa;border:1px solid #eee;border-radius:8px;padding:10px;font-size:12.5px;max-height:200px;overflow:auto}
    audio{width:100%;max-width:420px;margin-top:8px}
    .dim-row{border-bottom:1px solid #f0f0f0;padding:10px 0}
    .dim-row:last-child{border-bottom:none}
    .dim-head{display:flex;justify-content:space-between;align-items:baseline}
    .dim-head b{font-size:13.5px}
    .dim-w{font-size:12px;color:#6b6b6b;font-weight:700}
    .anchor{font-size:11.5px;color:#9a9a9a;margin:3px 0 6px}
    .dim-inputs{display:grid;grid-template-columns:86px 1fr;gap:8px}
    .score-in{width:100%;padding:7px 8px;border:1.5px solid #d9d9d9;border-radius:7px;font-size:15px;font-weight:800;color:#d60012;text-align:center}
    .score-in:focus{outline:none;border-color:#d60012}
    .comment-in{padding:7px 9px;border:1px solid #e3e3e3;border-radius:7px;font-size:12.5px}
    .comment-in:focus{outline:none;border-color:#d60012}
    label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
    textarea{width:100%;border:1px solid #e3e3e3;border-radius:8px;padding:9px;font-size:13px;font-family:inherit;resize:vertical}
    textarea:focus{outline:none;border-color:#d60012}
    .note{background:#fff6f6;border:1px solid #ffd6d9;border-left:4px solid #d60012;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#a3000d;margin-top:10px}
    .savebar{position:fixed;bottom:0;left:0;right:0;background:#0a0a0a;padding:12px 20px;display:flex;align-items:center;gap:14px;z-index:10;flex-wrap:wrap}
    .preview{color:#fff;font-size:14px;font-weight:600;flex:1;min-width:220px}
    .preview .big{color:#ff4d57;font-size:22px;font-weight:900}
    .btn{cursor:pointer;background:#d60012;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:700}
    .btn.ghost{background:transparent;color:#fff;border:1px solid #777}
    .btn:disabled{opacity:.5;cursor:default}
    .ok-banner{background:#e8f8f0;border:1px solid #bfe8d2;color:#0a6b3d;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
    .ok-banner a{color:#d60012;font-weight:700;margin-right:12px}
    .warn{background:#fff0f0;border:1.5px solid #d60012;border-radius:8px;padding:12px 16px;font-size:13.5px;color:#8a0010;margin-bottom:14px;line-height:1.7}
  </style>
</head>
